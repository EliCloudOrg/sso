name: Deploy to production

# 触发：
#   - push 到 prod 分支
#   - workflow_dispatch（人工触发，可输入任意 ref：分支 / tag / commit SHA，用于回滚）
on:
  push:
    branches: [prod]
  workflow_dispatch:
    inputs:
      ref:
        description: "要部署的 Git ref（分支 / tag / commit SHA）。回滚时填上一个可用版本。"
        required: false
        default: prod

permissions:
  contents: read
  packages: write

# 同一时间只跑一次生产部署；已在跑的部署不因新推送被取消
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  # 阶段一（可选）：构建产物并推送镜像。
  # 仅当仓库变量 DEPLOY_MODE == "image" 时执行；否则本 job 被跳过，
  # 阶段二会因下面的 if 条件（skipped 也算通过）继续执行。
  image:
    name: Build and push image
    if: ${{ vars.DEPLOY_MODE == 'image' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 回滚（workflow_dispatch 传旧 ref）时必须构建「那个 ref」的代码。
          # 若沿用默认行为（检出触发分支），阶段一会把 :prod 重新指向当前分支的构建，
          # 只有 deploy.sh 收到旧 ref —— 镜像模式下的回滚语义就被破坏了。
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Resolve image name and short sha
        id: meta
        run: |
          set -euo pipefail
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          # 不能用 ${GITHUB_SHA::7}：回滚时它指向「触发分支」的最新提交，
          # 而这里检出的是 inputs.ref，取 HEAD 才与构建的代码对得上。
          echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:prod
            ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 阶段二（必选）：把 deploy.sh 送上服务器并执行。
  # 必须先满足「阶段一成功，或被跳过」，阶段一失败则不执行。
  deploy:
    name: Trigger remote deploy
    needs: [image]
    if: ${{ always() && (needs.image.result == 'success' || needs.image.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # 注意：这里故意**不**跟随 inputs.ref，始终用「这次 workflow 所在分支」的
        # deploy/deploy.sh。约定是「同一个 deploy.sh 用另一个 ref 再跑一次」：
        # 回滚不应把老的部署脚本也一起带回来（见 README-deploy.md 回滚流程）。

      - name: Upload deploy script to /srv/sso
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: deploy/deploy.sh
          target: /srv/sso
          # source 是 deploy/deploy.sh，去掉第一段路径后落成 /srv/sso/deploy.sh
          strip_components: 1
          overwrite: true

      - name: Run /srv/sso/deploy.sh
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -eu
            chmod +x /srv/sso/deploy.sh
            /srv/sso/deploy.sh "${{ github.event.inputs.ref || 'prod' }}"
